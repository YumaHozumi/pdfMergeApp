version: '3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-container
    networks:
      - webnet
    restart: always
    environment:
      TZ: Asia/Tokyo
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-container
    ports:
      - 8080:8080
    networks:
      - webnet
    restart: always
    environment:
      TZ: Asia/Tokyo
networks:
  webnet: